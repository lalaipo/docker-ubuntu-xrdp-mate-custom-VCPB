name: SysOpt CI Debug Harness (Redroid with ARM NDK)

on:
  workflow_dispatch: {}

jobs:
  android-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup binder and redroid kernel modules
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-modules-extra-$(uname -r) adb
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || true
          if [ ! -e /dev/binder ]; then
            sudo mkdir -p /dev/binderfs
            sudo mount -t binderfs binderfs /dev/binderfs || true
            sudo ln -s /dev/binderfs/binder /dev/binder || true
            sudo ln -s /dev/binderfs/hwbinder /dev/hwbinder || true
            sudo ln -s /dev/binderfs/vndbinder /dev/vndbinder || true
          fi
          ls -la /dev/binder* || true

      - name: Start Redroid container
        run: |
          docker run -d --privileged \
            --name redroid \
            -p 5555:5555 \
            -v /tmp/redroid-data:/data \
            erstt/redroid:11.0.0_ndk_ChromeOS \
            androidboot.redroid_gpu_mode=guest \
            ro.product.cpu.abilist=x86_64,arm64-v8a,x86,armeabi-v7a,armeabi \
            ro.product.cpu.abilist64=x86_64,arm64-v8a \
            ro.product.cpu.abilist32=x86,armeabi-v7a,armeabi

      - name: Wait for Redroid and Run Instrumentation
        run: |
          echo "Connecting adb..."
          for i in $(seq 1 30); do
            adb connect localhost:5555 && break || sleep 2
          done

          adb wait-for-device
          echo "Waiting for boot completed..."
          while [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]; do
            sleep 2
          done
          echo "Boot completed!"

          echo "== device info =="
          adb shell getprop ro.build.version.sdk
          adb shell getprop ro.product.cpu.abi
          adb shell getprop ro.product.cpu.abilist

          echo "== installing target APK =="
          adb install -r -g apk_payload/app.apk

          echo "== clearing logcat buffer =="
          adb logcat -c

          echo "== launching app =="
          adb shell monkey -p com.itos.sysopt -c android.intent.category.LAUNCHER 1
          sleep 6

          echo "== running UI tap automation =="
          python3 apk_payload/ui_tap.py || true

          sleep 3
          echo "== final UI dump after taps =="
          adb shell uiautomator dump /sdcard/window_dump_after.xml || true
          adb pull /sdcard/window_dump_after.xml ./window_dump_after.xml || true

          echo "== SYSOPT_DBG LOGCAT OUTPUT =="
          adb logcat -d | grep SYSOPT_DBG || echo "NO SYSOPT_DBG LINES FOUND"

          echo "== full recent logcat tail (for context) =="
          adb logcat -d | tail -n 300

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sysopt-debug-artifacts
          path: |
            window_dump*.xml
          if-no-files-found: warn
