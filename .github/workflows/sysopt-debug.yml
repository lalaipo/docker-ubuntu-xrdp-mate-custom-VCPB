name: SysOpt CI Debug Harness

on:
  workflow_dispatch: {}

jobs:
  android-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-28-x86_64-v2

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          profile: pixel
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run instrumentation capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          profile: pixel
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -e
            adb wait-for-device
            adb shell input keyevent 82

            echo "== device info =="
            adb shell getprop ro.build.version.sdk
            adb shell getprop ro.product.cpu.abi

            echo "== installing CI test APK (dummy x86_64 native stub, same dex as v19) =="
            adb install -r -g apk_payload/app_citest.apk

            echo "== clearing logcat buffer =="
            adb logcat -c

            echo "== launching app =="
            adb shell monkey -p com.itos.sysopt -c android.intent.category.LAUNCHER 1
            sleep 8

            echo "== app process check =="
            adb shell pidof com.itos.sysopt || echo "APP PROCESS NOT RUNNING"
            APP_PID=$(adb shell pidof com.itos.sysopt | tr -d '\r')
            echo "APP_PID=$APP_PID"

            echo "== running UI tap automation =="
            python3 apk_payload/ui_tap.py || true

            sleep 3
            echo "== final UI dump after taps =="
            adb shell uiautomator dump /sdcard/window_dump_after.xml
            adb pull /sdcard/window_dump_after.xml ./window_dump_after.xml || true

            echo "== SYSOPT_DBG LOGCAT OUTPUT =="
            adb logcat -d | grep SYSOPT_DBG || echo "NO SYSOPT_DBG LINES FOUND"

            echo "== logcat filtered by app PID (full, no tail truncation) =="
            if [ -n "$APP_PID" ]; then
              adb logcat -d --pid="$APP_PID" || true
            fi

            echo "== logcat filtered by package tag AndroidRuntime/System.err/sysopt =="
            adb logcat -d | grep -iE "itos|sysopt|AndroidRuntime|FATAL EXCEPTION|System.err" | head -n 200

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sysopt-debug-artifacts
          path: |
            window_dump*.xml
          if-no-files-found: warn
